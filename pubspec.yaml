name: flutter_flowin
description: Flowin Design UI flutter package
version: 0.2.0+2
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  figma_squircle: ^0.6.3
  flutter:
    sdk: flutter
  ios_color_picker:
    git:
      url: https://github.com/luisburgos/ios_color_picker
      ref: master
  lucide_icons_flutter: ^3.1.15
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
