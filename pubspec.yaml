name: flutter_flowin
description: A Flutter design system built on design tokens and a Material-mapped theme, with a component library of buttons, inputs, chips, tabs, cards and sheets.
version: 0.2.0
homepage: https://luisburgos.github.io/flutter_flowin/
repository: https://github.com/luisburgos/flutter_flowin

# Max 5, lowercase alphanumeric or hyphens, 2-32 chars each.
topics:
  - design-system
  - user-interface
  - material-alternative
  - design
  - components

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  figma_squircle: ^0.6.3
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.15
  meta: ^1.17.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  super_tooltip: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
