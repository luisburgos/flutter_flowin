name: flowin_showcase
description: "A demo app showcasing the flutter_flowin component library."
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_flowin:
    path: ..
  # The picker the showcase injects into FlowinColorPickerField; the package
  # itself ships none. A git dependency is used here (see CONTRIBUTING).
  ios_color_picker:
    git:
      url: https://github.com/luisburgos/ios_color_picker
      ref: master
  # The low-fidelity wireframe kit the cover arts draw with. Extracted from
  # this very showcase into its own package; the vendored copy is gone and the
  # arts now consume the published one.
  lowframer: ^0.2.0
  # The playground affordance (preview + inspector + knobs), extracted into a
  # design-system-agnostic package the showcase consumes for every playground.
  playgrounder: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
