<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A live showcase of the Flowin Flutter design system components.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flowin UI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flowin UI</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Paints the page before Flutter does. Between the first byte and the first
    frame the canvas is empty, so whatever the browser has painted is what the
    reader sees, and a bare body is white. Opening in dark mode that white is a
    flash bright enough to be uncomfortable, which is why dark is the default
    here rather than the other way round.

    The two colors are ColorScheme.surface from FlowinDesignSchemes, duplicated
    because HTML cannot read Dart. They are the theme's own background, so the
    hand-off from this page to the first frame is invisible rather than a
    change of shade.

    The media query mirrors the app's ThemeMode.system: the browser knows the
    device appearance before Flutter starts, so matching it here means neither
    mode flashes.
  -->
  <style>
    :root { color-scheme: light dark; }
    /* FlowinDesignColors.neutral800 — ColorScheme.dark.surface. */
    html, body { margin: 0; background-color: #181818; }
    @media (prefers-color-scheme: light) {
      /* FlowinDesignColors.white — ColorScheme.light.surface. */
      html, body { background-color: #FFFFFF; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
