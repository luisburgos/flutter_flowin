include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Sibling app with its own analysis_options.yaml — analyzed on its own,
    # not as part of the package.
    - "showcase/**"
    # Third-party source vendored verbatim from ios_color_picker (MIT). Held
    # to its own authors' style rather than reformatted to ours: keeping it
    # diffable against upstream matters more than lint conformance, and
    # rewriting it would obscure what was actually copied. See the README in
    # that directory.
    - "lib/src/vendor/**"
